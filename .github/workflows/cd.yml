name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: aws-devops

      - name: Build Docker image
        run: |
          docker build -t aws-devops-platform:${{ github.event.workflow_run.head_sha }} .

      - name: Load image into kind
        run: |
          kind load docker-image aws-devops-platform:${{ github.event.workflow_run.head_sha }} --name aws-devops

      - name: Update deployment image
        run: |
          sed -i "s|image: aws-devops-platform:.*|image: aws-devops-platform:${{ github.event.workflow_run.head_sha }}|" k8s/deployment.yaml

      - name: Deploy application
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/aws-devops-platform --timeout=120s

      - name: Verify application health
        run: |
          kubectl run health-check \
            --rm \
            -i \
            --restart=Never \
            --image=curlimages/curl:8.10.1 \
            -- \
            curl -f http://aws-devops-platform.default.svc.cluster.local/health
